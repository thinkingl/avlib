<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVLib - AV信息管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AVLib <small>AV信息管理系统</small></h1>
            <div id="versionInfo" class="version-info"></div>
        </header>

        <main>
            <!-- 搜索区域 -->
            <section class="search-section">
                <div class="search-form">
                    <textarea id="avIds" placeholder="输入番号，每行一个或用逗号分隔&#10;例如：ABP-123 / SSNI-456"></textarea>
                    <div class="search-options">
                        <label>
                            <input type="checkbox" name="source" value="javdb" checked> JavDB
                        </label>
                        <label>
                            <input type="checkbox" name="source" value="javbus" checked> JavBus
                        </label>
                    </div>
                    <div class="button-group">
                        <button id="searchBtn" class="btn btn-primary">搜索</button>
                    </div>
                </div>
            </section>

            <!-- 加载指示器 -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在搜索中...</p>
            </div>

            <!-- 搜索结果 -->
            <section id="searchResults" class="results-section" style="display: none;">
                <h2>搜索结果</h2>
                <div id="resultsList" class="results-list"></div>
            </section>

            <!-- 历史记录 -->
            <section class="history-section">
                <details id="historyPanel">
                    <summary>
                        <span>历史记录</span>
                        <button id="loadHistoryBtn" class="btn btn-secondary btn-sm">刷新</button>
                    </summary>
                    <div id="historyList" class="history-list"></div>
                </details>
            </section>

            <!-- 配置区域 -->
            <section class="config-section">
                <details id="configPanel">
                    <summary>DokuWiki配置</summary>
                    <div class="config-form">
                        <div class="form-group">
                            <label for="wikiUrl">Wiki地址：</label>
                            <input type="text" id="wikiUrl" placeholder="http://localhost/dokuwiki">
                        </div>
                        <div class="form-group">
                            <label for="wikiUsername">用户名：</label>
                            <input type="text" id="wikiUsername" placeholder="admin">
                        </div>
                        <div class="form-group">
                            <label for="wikiPassword">密码：</label>
                            <input type="password" id="wikiPassword" placeholder="密码">
                        </div>
                        <div class="form-group">
                            <label for="wikiToken">API Token（可选）：</label>
                            <input type="text" id="wikiToken" placeholder="API Token">
                        </div>
                        <div class="button-group">
                            <button id="saveConfigBtn" class="btn btn-primary">保存配置</button>
                            <button id="testConnectionBtn" class="btn btn-secondary">测试连接</button>
                        </div>
                    </div>
                </details>
            </section>
        </main>

        <!-- 大图查看 -->
        <div id="lightbox" class="lightbox" style="display: none;" onclick="closeLightbox()">
            <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
        </div>

        <!-- 消息提示 -->
        <div id="toast" class="toast" style="display: none;"></div>

        <!-- Wiki内容预览弹窗 -->
        <div id="wikiModal" class="modal-overlay" style="display: none;">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="wikiModalTitle">DokuWiki内容</h3>
                    <button class="btn btn-sm btn-close" onclick="closeWikiModal()">&times;</button>
                </div>
                <pre id="wikiContent" class="wiki-content"></pre>
                <div class="button-group modal-footer">
                    <button id="copyWikiBtn" class="btn btn-primary" onclick="copyWikiContent()">复制内容</button>
                    <button class="btn btn-secondary" onclick="closeWikiModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
